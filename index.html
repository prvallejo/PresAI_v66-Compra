<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PresAI — Presupuesto de Obra</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'IBM Plex Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f2040 60%, #1a4a8a 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 420px;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #93c5fd;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 32px;
            letter-spacing: -0.8px;
            font-weight: 700;
        }
        h1 span {
            color: #93c5fd;
        }
        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        p {
            margin: 0.75rem 0;
            font-size: 14px;
            opacity: 0.85;
            line-height: 1.6;
        }
        a {
            color: #93c5fd;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(147, 197, 253, 0.3);
        }
        a:hover {
            color: #fff;
            border-bottom-color: rgba(255, 255, 255, 0.6);
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
        .feature {
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .feature-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
    <script>
        // Redireccionar a la versión más reciente
        window.location.href = 'presai_v97.html';
    </script>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Pres<span>AI</span></h1>
        <div class="subtitle">Presupuesto de Obra</div>
        <p>Cargando la versión más reciente...</p>
        <p>Si no eres redireccionado automáticamente, <a href="presai_v97.html">haz clic aquí</a>.</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📋</div>
                <div>Presupuestos</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🛒</div>
                <div>Compras</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div>APU</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📐</div>
                <div>Cubicaciones</div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PresAI - Redireccionando...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f2040 60%, #1a4a8a 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #93c5fd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 28px;
            letter-spacing: -0.5px;
        }
        h1 span {
            color: #93c5fd;
        }
        p {
            margin: 0.5rem 0;
            font-size: 14px;
            opacity: 0.9;
        }
        a {
            color: #93c5fd;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        a:hover {
            color: #fff;
        }
    </style>
    <script>
        // Redireccionar a la versión más reciente
        window.location.href = 'presai_v97.html';
    </script>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>Pres<span>AI</span></h1>
        <p>Cargando la versión más reciente...</p>
        <p>Si no eres redireccionado automáticamente, <a href="presai_v97.html">haz clic aquí</a>.</p>
    </div>
</body>
</html>

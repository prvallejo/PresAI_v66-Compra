            margin: 0;
            background-color: #f0f4f8;
            color: #1e3a5f;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;

        @keyframes spin {

        a {

            text-decoration: none;
